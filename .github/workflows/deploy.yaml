name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install
      
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install
      
      - name: Run Jest Tests (Backend)
        run: |
          cd backend
          npm test
      
      - name: Run Jest Tests (Frontend)
        run: |
          cd frontend
          npm test
